# cargo-deny configuration (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# `--all-features` covers the optional dependencies too (pyo3 for `python`;
# the sibling bridges ml / voice / search / font are path dependencies).

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # bincode 1.x is unmaintained (no upgrade path). The v2 tuned format and
    # the v3 columns are bincode 1.x encodings, so replacing it is a change of
    # the on-disk format, not a dependency bump.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x defines the stored v2 / v3 formats" },
]

# ---------------------------------------------------------------------------
# Licenses (allow list)
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    # only the licenses present in the dependency graph; a new one is added
    # here deliberately when a dependency brings it in
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
]

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
# the optional sibling bridges are path dependencies of this unpublished crate
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
