name: CI

# scripts/preflight.sh runs the same commands with the same arguments locally;
# a step added here is added there in the same commit.

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04-arm, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      # the toolchain itself comes from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test (unit + doc, default features)
        run: cargo test

      - name: Test (unit + doc, ffi)
        run: cargo test --features ffi

      - name: Example (text_law)
        run: cargo run --example text_law

      - name: Benches compile
        run: cargo bench --no-run

  clippy:
    name: Clippy (pedantic + nursery, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # pedantic / nursery are enabled in Cargo.toml [lints.clippy]
      - name: Clippy (default features, all targets)
        run: cargo clippy --all-targets -- -D warnings
      # python is linted, not linked: the extension module is built by maturin
      - name: Clippy (ffi + python, all targets)
        run: cargo clippy --all-targets --features ffi,python -- -D warnings

      # Every optional feature on its own (read from Cargo.toml), so a feature no other step builds cannot break
      # unseen
      - name: Test the feature check
        run: python3 scripts/feature_check.py --self-test

      - name: Check each optional feature
        run: python3 scripts/feature_check.py --ci

  # The declared `rust-version` compiled with exactly that toolchain. Bump
  # `rust-version` in Cargo.toml and the version below in the same commit.
  msrv:
    name: MSRV (rust-version = 1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      # library only: the dev-dependencies (criterion) follow their own MSRV
      - name: cargo check on MSRV (lib, default features)
        run: cargo +1.87 check --lib
      - name: cargo check on MSRV (lib, ffi + python)
        run: cargo +1.87 check --lib --features ffi,python

  doc:
    name: Doc (RUSTDOCFLAGS=-Dwarnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (no-deps, default features)
        run: cargo doc --lib --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"
      - name: cargo doc (no-deps, ffi + python)
        run: cargo doc --lib --no-deps --features ffi,python
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  unicode:
    # the Unicode tables against their generator and their data, and every scalar value against Python's
    # unicodedata at the same Unicode version (another version fails, it is not compared)
    name: Unicode tables and cross-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # unicodedata 16.0.0 (the version of data/ucd/)
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tables are what the generator writes from the hashed data
        run: python scripts/gen_unicode_tables.py --check
      - name: Cross-check (tests)
        run: python scripts/test_unicode_crosscheck.py
      - name: The data cannot change quietly (a file edited with its SHA256SUMS moves the pinned ids)
        run: python scripts/test_unicode_data_pin.py
      - name: Every scalar value against unicodedata
        shell: bash
        run: |
          set -euo pipefail
          # (no --locked, as in the other jobs: the optional siblings are stubs here, so the lock cannot match)
          cargo run --release --example unicode_dump > unicode_dump.txt
          python scripts/unicode_crosscheck.py unicode_dump.txt

  docs-lint:
    # run on every OS so a locale or path difference in the checker itself
    # shows up here rather than as a silent pass
    name: Docs lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Docs lint (tests)
        run: python scripts/test_docs_lint.py
      - name: Docs lint (public documents, CHANGELOG structure)
        run: python scripts/docs_lint.py --check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
